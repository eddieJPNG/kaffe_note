name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (TypeScript strict)
        run: npm run typecheck

      - name: Build (static export + injeção da CSP)
        run: npm run build

      - name: Security gate (cabeçalhos + CSP)
        run: node scripts/verify-headers.mjs

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7
