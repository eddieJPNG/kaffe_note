name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions fixadas por SHA completo (não tag mutável) — supply chain.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit de dependências (falha em CVE alto/crítico)
        run: npm audit --audit-level=high

      - name: Typecheck (TypeScript strict)
        run: npm run typecheck

      - name: Build (static export + injeção da CSP)
        run: npm run build

      - name: Security gate (cabeçalhos + CSP)
        run: node scripts/verify-headers.mjs

      - name: Upload static artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: out
          retention-days: 7
