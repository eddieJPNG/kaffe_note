name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions fixadas por SHA completo (não tag mutável) — supply chain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit de dependências (falha em CVE alto/crítico)
        run: npm audit --audit-level=high

      - name: Typecheck (TypeScript strict)
        run: npm run typecheck

      - name: Build (static export + injeção da CSP)
        run: npm run build

      - name: Security gate (cabeçalhos + CSP)
        run: node scripts/verify-headers.mjs

      - name: Upload static artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: out
          retention-days: 7
